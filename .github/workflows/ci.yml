name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahkar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE1_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shahkar?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Migrate and seed
        run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          npm start > server.log 2>&1 &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000
          npm run test:e2e
      - name: Server log
        if: failure()
        run: cat server.log
